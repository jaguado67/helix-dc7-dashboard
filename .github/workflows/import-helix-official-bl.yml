name: Import verified HELIX DC7 official baseline
on:
  push:
    branches: [audit/dc7-helix-official-bl-counts-20261012]
    paths: [.github/workflows/import-helix-official-bl.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify exact HELIX baseline, then package
        run: |
          python -m pip install --disable-pip-version-check gdown
          python - <<'PY'
          from pathlib import Path
          import hashlib, gzip, base64
          import gdown
          name="226021-HE.B.xer"
          fid="1hWBBoCJaDcl1xNFvf-u17lEXUglBPXJN"
          expected="1057564634e2392de2f5a3f825d15363a50f5a8f9b152bc1733c128dbf1d8d2b"
          target=Path("/tmp")/name
          result=gdown.download(id=fid, output=str(target),quiet=False)
          if not result or not target.is_file(): raise RuntimeError("Download failed")
          b=target.read_bytes()
          digest=hashlib.sha256(b).hexdigest()
          assert len(b)==3042495, (len(b),"File size changed")
          assert digest==expected,(digest,"File SHA256 changed")
          assert b.startswith(b"ERMHDR"),"Unexpected XER file header"
          s=b.decode("utf-8-sig",errors="replace")
          assert "%T\tPROJECT" in s and "%T\tTASK" in s and "%T\tPROJWBS" in s
          body=s.split("%T\tPROJECT",1)[1].split("\n%T\t",1)[0]
          assert "226021-HE.B" in body,"Incorrect P6 project"
          encoded=base64.b64encode(gzip.compress(b,compresslevel=9,mtime=0)).decode("ascii")
          folder=Path("DC7/data");folder.mkdir(exist_ok=True,parents=True)
          parts=[encoded[i:i+180000] for i in range(0,len(encoded),180000)]
          for i,chunk in enumerate(parts,1):
              (folder/f"{name}.gz.b64.part{i:03d}").write_text(chunk,encoding="ascii")
          (folder/f"{name}.sha256").write_text(expected+"  "+name+"\n",encoding="ascii")
          print(f"VERIFIED_BASELINE name={name} bytes={len(b)} sha256={digest} parts={len(parts)}")
          PY
      - name: Commit verified official baseline to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DC7/data/226021-HE.B.xer.gz.b64.part* DC7/data/226021-HE.B.xer.sha256
          if ! git diff --cached --quiet; then
            git commit -m "DC7: import authenticated official HELIX baseline XER"
            git push origin HEAD:audit/dc7-helix-official-bl-counts-20261012
          fi
