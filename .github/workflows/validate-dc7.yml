name: Validate DC7 dashboard

on:
  push:
    branches: [main, fix/dc7-p6-wbs-complete-foh-boh-20261012]
    paths:
      - "DC7/**"
      - ".github/workflows/validate-dc7.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py DC7
      - name: Smoke-test SUFFOLK and HELIX models
        run: |
          python - <<'PY'
          import base64
          import gzip
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path("DC7").resolve()))
          from src.dc7_model import build_dc7_model, build_suffolk_model

          raw = Path("DC7/data")
          root = Path(tempfile.mkdtemp(prefix="validate_dc7_"))
          for name in ("226021.005.MO-BL.xer", "226021.010.MO-UP.xer", "226021.010.MO-UP-C.xer"):
              parts = sorted(raw.glob(f"{name}.gz.b64.part*"))
              assert parts, f"No parts for {name}"
              encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
              (root / name).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          aux_name = "226021-HE.B-4.xer"
          parts = sorted(raw.glob(f"{aux_name}.b64.part*"))
          assert parts, "No dedicated HELIX data parts"
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          (root / aux_name).write_bytes(base64.b64decode(encoded))

          helix = build_dc7_model(root)
          suffolk = build_suffolk_model(helix)

          h_total = helix.status_counts()["Total"]
          s_total = suffolk.status_counts()["Total"]
          assert h_total == 2545, f"HELIX count unexpectedly changed: {h_total}"
          assert s_total == h_total, f"SUFFOLK scoped {s_total} does not match HELIX construction {h_total}"
          assert not helix.scurve().empty, "HELIX S-curve missing"
          assert not suffolk.area_windows().empty, "SUFFOLK windows missing"
          assert not suffolk.area_stats().empty, "SUFFOLK area matrix missing"
          for scope_model in (suffolk, helix):
              matrix = scope_model.area_stats()
              assert int(matrix["Total Tasks"].sum()) == 2545
              assert "MOH" not in set(matrix["Area"]), "Auxiliary MOH must never enter the Suffolk construction totals"
          # Original FOH/BOH WBS labels; two Shell/Foundation activities
          # are EXCLUDED from the area WBS tables/plots, not from the source
          # project population or its documented audit trail.
          expected = {
              "FOH": {
                  "Priority Walls": 34, "Other Rooms": 145,
                  "Equipment": 11, "Commissioning & Start Up": 0,
              },
              "BOH": {
                  "Priority Walls": 35, "Other Rooms": 81,
                  "Equipment": 13, "Commissioning & Start Up": 4,
              },
          }
          special = {"FOH": "FDN.1296", "BOH": "FDN.1300"}
          for area, grouping in expected.items():
              detail = suffolk.wbs_area_activities(area)
              source_with_exceptions = suffolk.wbs_area_activities(area, include_exceptions=True)
              report = suffolk.wbs_area_stats(area)
              source = suffolk.current_tasks[suffolk.current_tasks["Area"].eq(area)]
              assert dict(zip(report["Area"], report["Tasks"])) == grouping, (area, report)
              assert report["Area"].tolist() == list(grouping), (area, report["Area"].tolist())
              assert len(report) == 4, f"All four original P6 WBS branches must appear in {area}"
              assert report["Area"].is_unique
              if area == "FOH":
                  empty = report.set_index("Area").loc["Commissioning & Start Up"]
                  assert int(empty["Tasks"]) == 0
                  assert float(empty["Activity Completion %"]) == 0.0
                  assert all(int(empty[k]) == 0 for k in ("Completed", "In Progress", "Not Started"))
              assert len(detail) == len(source) - 1 == sum(grouping.values())
              assert len(source_with_exceptions) == len(source)
              assert set(source["task_code"]) - set(detail["task_code"]) == {special[area]}
              assert "Foundations" not in set(report["Area"]), area
              assert set(detail["task_code"]) == set(source["task_code"]) - {special[area]}
              assert len(detail["task_code"]) == detail["task_code"].nunique()
              for field in ("Completed", "In Progress", "Not Started"):
                  assert int(report[field].sum()) == int(detail["Status"].eq(field).sum())
              assert detail["WBS Path"].str.contains("Construction / ").all()
              assert not detail["WBS Path"].str.contains("Procurement").any()
              # Existing original P6 data is not modified.
              assert suffolk.subarea_stats(area)["Tasks"].sum() == len(source)
          assert sum(sum(groups.values()) for groups in expected.values()) == 323
          exception_report = helix.audit_reports["wbs_exceptions"]
          assert set(exception_report["Activity ID"]) == set(special.values())
          assert len(exception_report) == 2
          assert set(exception_report["QTS - AREA"]) == {"FOH", "BOH"}
          assert exception_report["Original P6 WBS"].str.contains("Shell / Foundations").all()
          report = helix.audit_reports["active"]
          flagged = report[report["Activity ID"].isin(special.values())]
          assert len(flagged) == 2
          assert flagged["Audit"].str.contains("WBS EXCEPTION").all()
          assert not helix.audit_reports["departures"]["Activity ID"].isin(special.values()).any()
          print("PASS: FOH/BOH WBS 190+133; two foundation IDs explicit audit exceptions, source still 2545")

          assert not helix.lineup_stats("DH1100").empty, "HELIX line-ups missing"
          assert helix.fte_ready_comparison().empty, "Archived FTE milestones leaked into active Construction"

          # Consolidation is a view-only transformation for HELIX Data Halls.
          # Neither source activity codes nor SUFFOLK grouping may change.
          import pandas as pd
          original_task_data = helix.current_tasks[["task_id", "task_code", "Subarea", "Status"]].copy(deep=True)
          for hall in ("DH1100", "DH1200", "DH1300", "DH1400", "DH1500", "DH1600"):
              before = helix.subarea_stats(hall)
              after = helix.subarea_stats(hall, helix_display=True)
              assert len(after) <= len(before), hall
              for column in ("Tasks", "Completed", "In Progress", "Not Started"):
                  assert int(before[column].sum()) == int(after[column].sum()), (hall, column)
              source = helix.current_tasks[helix.current_tasks["Area"].eq(hall)]
              assert int(after["Tasks"].sum()) == len(source), hall

          pd.testing.assert_frame_equal(
              original_task_data,
              helix.current_tasks[["task_id", "task_code", "Subarea", "Status"]],
          )
          # All main-view counts are strictly HELIX-assigned construction activities.
          assert helix.status_counts() == {
              "Total": 2545, "Completed": 187,
              "In Progress": 32, "Not Started": 2326
          }
          summary = dict(zip(helix.audit_reports["summary"]["Metric"], helix.audit_reports["summary"]["Value"]))
          assert int(summary["Matched to Baseline by Activity ID"]) == 2545
          assert int(summary["Previous HELIX construction"]) == 2576
          assert int(summary["Former HELIX construction no longer active"]) == 31
          assert int(summary["Current HELIX outside Construction"]) == 18
          assert len(helix.audit_reports["departures"]) == 31
          assert len(helix.audit_reports["active"]) == 2545
          removed = helix.audit_reports["departures"]
          assert removed["Activity ID"].str.endswith(".IST.6100").sum() == 6
          assert not (helix.current_tasks["task_code"].isin(removed["Activity ID"])).any()
          assert str(helix.data_date.date()) == "2026-08-26", helix.data_date
          assert str(helix.current_finish.date()) == "2027-06-22", helix.current_finish
          print("PASS: Suffolk Current-C, 2545 active HELIX Construction, BL match, 31 departures and 6 archived FTE")
          print("PASS: six HELIX Data Halls consolidated to seven groups; no changes to source activity records")

          print(f"PASS: HELIX={h_total}; SUFFOLK construction scope={s_total}; two views and line-ups validated")
          PY
