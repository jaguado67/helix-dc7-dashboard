name: Validate DC7 Official XER Dashboard
on:
  push:
    branches: [main, feat/dc7-u08-he-u01-review-v036]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-dc7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official dashboard requirements
        run: python -m pip install -r DC7/requirements.txt
      - name: Compile DC7 source
        run: python -m compileall -q DC7
      - name: P6 XER source and schedule reconciliation
        env:
          PYTHONPATH: DC7
        run: python DC7/validate_v036.py
