name: Validate DC7 Suffolk + HELIX BL/U01

on:
  push:
    branches: [main, feat/dc7-helix-u01-fb-review-v036]
    paths:
      - "DC7/**"
      - ".github/workflows/validate-dc7.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile dashboard Python
        run: python -m compileall -q app.py DC7
      - name: Audit original Suffolk and independent HELIX XER updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import tempfile
          import sys
          import pandas as pd

          sys.path.insert(0, str(Path("DC7").resolve()))
          from src.dc7_model import build_dc7_model, build_suffolk_model
          from src.helix_baseline import (
              HALLS, lineup_order, lineup_area_status_summary,
              wbs_lineup_hierarchy, helix_bl_current_overview,
              us_federal_workday_delay,
          )

          root = Path(tempfile.mkdtemp(prefix="dc7_xer_review_"))
          src = Path("DC7/data")
          for name in (
              "226021.005.MO-BL.xer",
              "226021.010.MO-UP.xer",
              "226021.010.MO-UP-C.xer",
              "226021-HE.B.xer",
          ):
              parts = sorted(src.glob(f"{name}.gz.b64.part*"))
              assert parts, f"Missing pinned official XER parts: {name}"
              encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              if name == "226021-HE.B.xer":
                  assert len(raw) == 3042495
                  assert hashlib.sha256(raw).hexdigest() == (
                      "1057564634e2392de2f5a3f825d15363a50f5a8f9b152bc1733c128dbf1d8d2b"
                  )
              if name == "226021.010.MO-UP-C.xer":
                  assert hashlib.sha256(raw).hexdigest() == (
                      "91bc8183e75b0e02b130a2eee512d68c054b49deeedf24e0bc07beea67839b2d"
                  )
              (root / name).write_bytes(raw)

          name = "226021-HE.U01.xer"
          parts = sorted(src.glob(f"{name}.raw.b64.part*"))
          assert len(parts) == 7, "All 7 HELIX U01 source packages are required"
          raw = base64.b64decode(
              "".join(p.read_text(encoding="ascii").strip() for p in parts),
              validate=True,
          )
          assert len(raw) == 3044612
          assert hashlib.sha256(raw).hexdigest() == (
              "e5398c6e17c4797d7e269273e2104971730c7c0e3fd4e010f246924ca3bec472"
          )
          (root / name).write_bytes(raw)
          helix = build_dc7_model(root)
          suffolk = build_suffolk_model(helix)
          assert str(helix.auxiliary_project["proj_short_name"]) == "226021-HE.B"
          assert str(helix.auxiliary_update_project["proj_short_name"]) == "226021-HE.U01"
          assert str(pd.Timestamp(helix.auxiliary_update_project["last_recalc_date"]).date()) == "2026-10-14"
          assert str(suffolk.data_date.date()) == "2026-08-26"
          assert suffolk.status_counts() == {
              "Total":2545, "Completed":187, "In Progress":32, "Not Started":2326
          }
          assert int(helix.audit_reports["summary"].loc[
              helix.audit_reports["summary"]["Metric"].eq("Matched to Baseline by Activity ID"),
              "Value"
          ].iloc[0]) == 2545
          assert set(helix.audit_reports["wbs_exceptions"]["Activity ID"]) == {"FDN.1296","FDN.1300"}
          print("PASS: Suffolk BL/Current-C 2545 Construction HELIX, 187/32/2326; audits intact")

          baseline=helix.independent_helix_baseline()
          current=helix.independent_helix_update()
          assert baseline and current
          assert baseline["_internal_control"] == current["_internal_control"] == {
              "total_source":4689, "HELIX_total":4197,
              "HELIX_in_scope":4153, "HELIX_outside_scope":44,
              "other_or_unassigned":492
          }
          assert baseline["_audit"]["Activity ID"].is_unique
          assert current["_audit"]["Activity ID"].is_unique
          assert set(baseline["_audit"]["Activity ID"]) == set(current["_audit"]["Activity ID"])
          assert baseline["_audit"]["Status"].value_counts().to_dict() == {
              "Not Started":4151, "Completed":2
          }
          assert current["_audit"]["Status"].value_counts().to_dict() == {
              "Not Started":4100, "Completed":42, "In Progress":11
          }

          binfo,_ = helix_bl_current_overview(
              baseline,current,helix.auxiliary_update_project["last_recalc_date"]
          )
          info,curve = helix_bl_current_overview(
              baseline,current,helix.auxiliary_update_project["last_recalc_date"]
          )
          assert info["Counts"] == {
              "Total":4153,"Completed":42,"In Progress":11,"Not Started":4100
          }
          assert str(info["Baseline Finish"].date()) == "2027-03-09"
          assert str(info["Current Finish"].date()) == "2027-03-20"
          assert info["Finish Shift (calendar days)"] == -11
          assert str(info["Current Data Date"].date()) == "2026-10-14"
          assert curve["Baseline Planned Activities"].iloc[-1] == 4153
          assert curve["Current Forecast Activities"].iloc[-1] == 4153
          assert curve.loc[curve["Date"].eq(pd.Timestamp("2026-10-14")),
                           "Actual Completed Activities"].iloc[0] == 42
          assert curve.loc[curve["Date"] > info["Current Data Date"],
                           "Actual Completed Activities"].isna().all()
          for area in (*HALLS,"MOH"):
              b=wbs_lineup_hierarchy(baseline,area)
              c=wbs_lineup_hierarchy(current,area)
              assert b["Line-Up"].tolist() == c["Line-Up"].tolist()
              assert b["Total Activities"].tolist() == c["Total Activities"].tolist()
              assert int(c["Total Activities"].sum()) == (229 if area == "MOH" else 654)
              assert int((c[["Completed","In Progress","Not Started"]].sum(axis=1) !=
                          c["Total Activities"]).sum()) == 0
              if area in HALLS:
                  assert c["Line-Up"].tolist() == list(lineup_order(area))
              if area=="DH1100":
                  assert int(c["Completed"].sum())==42 and int(c["In Progress"].sum())==11
                  assert int(c.loc[c["Line-Up"].eq("A110"),"Completed"].iloc[0])==4
              else:
                  assert int(c["Completed"].sum())==0 and int(c["In Progress"].sum())==0
          statuses=lineup_area_status_summary(current)
          assert int(statuses["Total Tasks"].sum()) == 4153
          assert int(statuses["Completed"].sum())==42
          print("PASS: HELIX BL/U01 4689 source, 4153 scope, 42/11/4100 and real 3-series S-curve")

          bc=baseline["_contract_milestones"].set_index("Activity ID")
          uc=current["_contract_milestones"].set_index("Activity ID")
          assert len(bc)==len(uc)==10
          assert bc.index.is_unique and uc.index.is_unique
          assert set(bc.index)==set(uc.index)
          revised=[id for id in bc.index if bc.loc[id,"Contractual Date"]!=uc.loc[id,"Contractual Date"]]
          assert set(revised)=={f"IST.{n}" for n in (1200,1300,1400,1500,1600)}
          assert str(uc.loc["IST.1400","Contractual Date"].date())=="2027-04-22"
          assert str(bc.loc["IST.1400","Contractual Date"].date())=="2026-04-22"
          assert str(uc.loc["M.1300","Current Finish"].date())=="2027-03-03"
          assert us_federal_workday_delay("2026-10-09","2026-10-13")==1
          assert us_federal_workday_delay("2026-11-25","2026-11-27")==1
          print("PASS: 10 HELIX-coded QC2.2/IST milestones; 5 revised named contract dates")
          assert "M.1100" not in uc.index and "IST.1100" not in uc.index
          print("REVIEW: DH1100 milestones remain outside HELIX-coded population; no artificial reassignment")
          print("REVIEW: FB FTE Complete activity IDs pending confirmation from Juan Pablo")

          view = Path("DC7/src/dc7_view.py").read_text(encoding="utf-8")
          helix_case=view.split('if view == "HELIX":',1)[1].split('return',1)[0]
          assert 'render_helix_kpis(helix)' in helix_case
          assert 'render_helix_baseline_scurve_and_status(helix)' in helix_case
          assert 'render_helix_lineups(helix)' in helix_case
          assert 'render_helix_contract_milestones(helix)' in helix_case
          assert 'render_scurve_and_status(helix)' not in helix_case
          assert 'render_scurve_and_status(suffolk)' in view
          assert 'PROGRESS S-CURVE' in view
          assert 'KEY MILESTONES VARIANCE' in view
          assert 'PROJECT PROGRESS BY AREA' in view
          assert 'SCHEDULE SUMMARY · BASELINE VS CURRENT UPDATE' in view
          assert 'HELIX SCHEDULE – ELECTRICAL LINE-UPS' in view
          assert 'SUFFOLK SCHEDULE – HELIX SCOPE ONLY' in view
          assert 'Contract Date Changed' in view
          assert "Completed/Total" not in view.split("def render_windows(",1)[1].split("def render_fte_ready(",1)[0]
          print("PASS: FB presentation changes and separation of Suffolk/HELIX schedules")
          PY
