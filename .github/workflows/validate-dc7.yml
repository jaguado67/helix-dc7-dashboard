name: Validate DC7 dashboard

on:
  push:
    branches: [main, feat/dc7-helix-lineups-only-baseline-structure]
    paths:
      - "DC7/**"
      - ".github/workflows/validate-dc7.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py DC7
      - name: Smoke-test SUFFOLK and HELIX models
        run: |
          python - <<'PY'
          import base64
          import gzip
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path("DC7").resolve()))
          from src.dc7_model import build_dc7_model, build_suffolk_model

          raw = Path("DC7/data")
          root = Path(tempfile.mkdtemp(prefix="validate_dc7_"))
          for name in ("226021.005.MO-BL.xer", "226021.010.MO-UP.xer", "226021.010.MO-UP-C.xer"):
              parts = sorted(raw.glob(f"{name}.gz.b64.part*"))
              assert parts, f"No parts for {name}"
              encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
              (root / name).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          # Deliberately place the now-rejected historical HELIX export in
          # the runtime folder: this must NEVER be loaded as the official BL.
          historical_name = "226021-HE.B-4.xer"
          parts = sorted(raw.glob(f"{historical_name}.b64.part*"))
          assert parts, "Historical fixture is missing"
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          (root / historical_name).write_bytes(base64.b64decode(encoded))
          assert not (root / "226021-HE.B.xer").exists()

          helix = build_dc7_model(root)
          suffolk = build_suffolk_model(helix)

          # HELIX is a baseline-only navigation, NOT a second SUFFOLK progress dashboard.
          from src.helix_baseline import HALLS, lineup_order, baseline_outline, summarize_approved_baseline
          outline = baseline_outline()
          assert list(outline.keys()) == list(HALLS) + ["MOH"]
          assert [x["Line-Up"] for x in outline["DH1100"][:2]] == ["A110", "B110"]
          assert [x["Line-Up"] for x in outline["DH1200"][:2]] == ["R120", "A120"]
          assert [x["Line-Up"] for x in outline["DH1300"][-2:]] == ["R130", "Commissioning"]
          assert [x["Line-Up"] for x in outline["DH1400"][:2]] == ["R140", "A140"]
          assert [x["Line-Up"] for x in outline["DH1500"][:2]] == ["A150", "B150"]
          assert [x["Line-Up"] for x in outline["DH1600"][:2]] == ["R160", "A160"]
          assert len(outline["DH1200"]) == 12
          assert outline["MOH"] == [{"WBS Level": "Equipment", "Line-Up": "Equipment"}]
          assert helix.independent_helix_baseline() is None
          assert helix.auxiliary_path is None

          # Native WBS fixture: ensure 1200 R before A, commissioning
          # isolated from electrical; MOH is its own Equipment branch.
          sample_wbs = [
              {"wbs_id":"1","proj_id":"BL","wbs_name":"HELIX","parent_wbs_id":"0"},
              {"wbs_id":"2","proj_id":"BL","wbs_name":"DH 1200","parent_wbs_id":"1"},
              {"wbs_id":"3","proj_id":"BL","wbs_name":"Electrical","parent_wbs_id":"2"},
              {"wbs_id":"4","proj_id":"BL","wbs_name":"R120","parent_wbs_id":"3"},
              {"wbs_id":"5","proj_id":"BL","wbs_name":"A120","parent_wbs_id":"3"},
              {"wbs_id":"6","proj_id":"BL","wbs_name":"Commissioning","parent_wbs_id":"2"},
              {"wbs_id":"7","proj_id":"BL","wbs_name":"MOH","parent_wbs_id":"1"},
              {"wbs_id":"8","proj_id":"BL","wbs_name":"Equipment","parent_wbs_id":"7"},
          ]
          sample_tasks = [
              {"task_id":str(i),"proj_id":"BL","wbs_id":wbsid,
               "task_code":code,"task_name":code,"status_code":"TK_NOTSTART",
               "target_start_date":"2026-09-29 08:00",
               "target_end_date":"2026-10-05 16:00"}
              for i, (wbsid,code) in enumerate(
                  [("4","R120-ACT"),("5","A120-ACT"),("6","CM-ACT"),("8","MOH-ACT")],1
              )
          ]
          sample = summarize_approved_baseline(
              {"PROJWBS":pd.DataFrame(sample_wbs),"TASK":pd.DataFrame(sample_tasks)},"BL"
          )
          dh1200 = sample["DH1200"]
          assert dh1200.iloc[0]["Line-Up"] == "R120"
          assert dh1200.iloc[0]["Baseline Tasks"] == 1
          assert dh1200.iloc[1]["Line-Up"] == "A120"
          assert dh1200.iloc[1]["Baseline Tasks"] == 1
          assert dh1200.iloc[-1]["Line-Up"] == "Commissioning"
          assert dh1200.iloc[-1]["Baseline Tasks"] == 1
          assert sample["MOH"].iloc[0]["Baseline Tasks"] == 1
          assert len(sample["_audit"]) == 4
          assert all(sample["_audit"]["Classification"] == "MAPPED")

          view_text = Path("DC7/src/dc7_view.py").read_text(encoding="utf-8")
          dispatch = view_text.split("def render_dashboard(",1)[1]
          assert 'if view == "HELIX":' in dispatch
          assert "render_helix_lineups(helix)" in dispatch
          assert dispatch.index("render_helix_lineups(helix)") < dispatch.index("render_kpis(suffolk")
          assert "render_progress_detail(helix" not in dispatch
          assert "render_scurve_and_status(helix)" not in dispatch
          assert "render_gates(helix)" not in dispatch
          print("PASS: HELIX baseline-only navigation and 6 DH line-up orders + MOH; no SUFFOLK progress duplication")

          h_total = helix.status_counts()["Total"]
          s_total = suffolk.status_counts()["Total"]
          assert h_total == 2545, f"HELIX count unexpectedly changed: {h_total}"
          assert s_total == h_total, f"SUFFOLK scoped {s_total} does not match HELIX construction {h_total}"
          assert not helix.scurve().empty, "HELIX S-curve missing"
          assert not suffolk.area_windows().empty, "SUFFOLK windows missing"
          assert not suffolk.area_stats().empty, "SUFFOLK area matrix missing"
          for scope_model in (suffolk, helix):
              matrix = scope_model.area_stats()
              assert int(matrix["Total Tasks"].sum()) == 2545
              assert "MOH" not in set(matrix["Area"]), "Auxiliary MOH must never enter the Suffolk construction totals"
          # Original FOH/BOH WBS labels; two Shell/Foundation activities
          # are EXCLUDED from the area WBS tables/plots, not from the source
          # project population or its documented audit trail.
          expected = {
              "FOH": {
                  "Priority Walls": 34, "Other Rooms": 145,
                  "Equipment": 11, "Commissioning & Start Up": 0,
              },
              "BOH": {
                  "Priority Walls": 35, "Other Rooms": 81,
                  "Equipment": 13, "Commissioning & Start Up": 4,
              },
          }
          special = {"FOH": "FDN.1296", "BOH": "FDN.1300"}
          for area, grouping in expected.items():
              detail = suffolk.wbs_area_activities(area)
              source_with_exceptions = suffolk.wbs_area_activities(area, include_exceptions=True)
              report = suffolk.wbs_area_stats(area)
              source = suffolk.current_tasks[suffolk.current_tasks["Area"].eq(area)]
              assert dict(zip(report["Area"], report["Tasks"])) == grouping, (area, report)
              assert report["Area"].tolist() == list(grouping), (area, report["Area"].tolist())
              assert len(report) == 4, f"All four original P6 WBS branches must appear in {area}"
              assert report["Area"].is_unique
              if area == "FOH":
                  empty = report.set_index("Area").loc["Commissioning & Start Up"]
                  assert int(empty["Tasks"]) == 0
                  assert float(empty["Activity Completion %"]) == 0.0
                  assert all(int(empty[k]) == 0 for k in ("Completed", "In Progress", "Not Started"))
              assert len(detail) == len(source) - 1 == sum(grouping.values())
              assert len(source_with_exceptions) == len(source)
              assert set(source["task_code"]) - set(detail["task_code"]) == {special[area]}
              assert "Foundations" not in set(report["Area"]), area
              assert set(detail["task_code"]) == set(source["task_code"]) - {special[area]}
              assert len(detail["task_code"]) == detail["task_code"].nunique()
              for field in ("Completed", "In Progress", "Not Started"):
                  assert int(report[field].sum()) == int(detail["Status"].eq(field).sum())
              assert detail["WBS Path"].str.contains("Construction / ").all()
              assert not detail["WBS Path"].str.contains("Procurement").any()
              # Existing original P6 data is not modified.
              assert suffolk.subarea_stats(area)["Tasks"].sum() == len(source)
          assert sum(sum(groups.values()) for groups in expected.values()) == 323
          exception_report = helix.audit_reports["wbs_exceptions"]
          assert set(exception_report["Activity ID"]) == set(special.values())
          assert len(exception_report) == 2
          assert set(exception_report["QTS - AREA"]) == {"FOH", "BOH"}
          assert exception_report["Original P6 WBS"].str.contains("Shell / Foundations").all()
          report = helix.audit_reports["active"]
          flagged = report[report["Activity ID"].isin(special.values())]
          assert len(flagged) == 2
          assert flagged["Audit"].str.contains("WBS EXCEPTION").all()
          assert not helix.audit_reports["departures"]["Activity ID"].isin(special.values()).any()
          print("PASS: FOH/BOH WBS 190+133; two foundation IDs explicit audit exceptions, source still 2545")

          # SUFFOLK Data Hall detail: seven user-approved P6 WBS groups,
          # with Electrical Rooms / Galleries collapsed from original branches.
          native_groups = (
              "Electrical Yard", "Mechanical Yard", "Electrical Rooms",
              "Data Hall", "Galleries", "Corridors",
              "Energization, Start-up & Commissioning",
          )
          expected_dh = {
              "DH1100": [28, 11, 51, 6, 249, 18, 0],
              "DH1200": [26, 11, 50, 7, 234, 12, 0],
              "DH1300": [24, 11, 46, 7, 234, 17, 0],
              "DH1400": [24, 11, 52, 7, 234, 18, 0],
              "DH1500": [24, 11, 54, 7, 234, 18, 0],
              "DH1600": [24, 6, 48, 7, 234, 18, 0],
          }
          exceptions_per_hall = {
              "DH1100": 32, "DH1200": 32, "DH1300": 20,
              "DH1400": 20, "DH1500": 23, "DH1600": 20,
          }
          shown_all = set()
          exceptions_all = set()
          for hall, expected_counts in expected_dh.items():
              source = suffolk.current_tasks[suffolk.current_tasks["Area"].eq(hall)]
              full = suffolk.data_hall_wbs_activities(hall, include_exceptions=True)
              chosen = suffolk.data_hall_wbs_activities(hall)
              summary = suffolk.data_hall_wbs_stats(hall)
              excluded = full[full["WBS Group"].eq("WBS EXCEPTION")]
              assert list(summary["Area"]) == list(native_groups), hall
              assert list(summary["Tasks"]) == expected_counts, (hall, summary)
              assert int(summary["Tasks"].sum()) == len(chosen), hall
              assert len(excluded) == exceptions_per_hall[hall], hall
              assert len(source) == len(chosen) + len(excluded), hall
              assert set(source["task_code"]) == set(full["task_code"]), hall
              assert set(chosen["task_code"]).isdisjoint(set(excluded["task_code"])), hall
              assert not chosen["WBS Path"].str.contains("Shell / Foundations").any()
              assert chosen["WBS Path"].str.contains("Construction / Interior Build-Outs").all()
              for col in ("Completed", "In Progress", "Not Started"):
                  assert int(summary[col].sum()) == int(chosen["Status"].eq(col).sum()), (hall, col)
              shown_all.update(chosen["task_code"])
              exceptions_all.update(excluded["task_code"])
          dh_ex = helix.audit_reports["dh_wbs_exceptions"]
          assert len(dh_ex) == 147 and dh_ex["Activity ID"].nunique() == 147
          assert set(dh_ex["Activity ID"]) == exceptions_all
          assert len(shown_all) == 2073
          assert len(shown_all | exceptions_all) == 2220
          assert set(helix.audit_reports["wbs_exceptions"]["Activity ID"]).isdisjoint(exceptions_all)
          flagged = helix.audit_reports["active"]
          marked = flagged[flagged["Activity ID"].isin(exceptions_all)]
          assert len(marked) == 147
          assert marked["Audit"].str.contains("WBS EXCEPTION").all()
          assert not dh_ex["Activity ID"].isin(helix.audit_reports["departures"]["Activity ID"]).any()
          print("PASS: DH1100-DH1600 seven native WBS groups; 2073 shown, 147 audited exceptions; 2545 total unchanged")

          assert helix.auxiliary_path is None, "Rejected -4 source incorrectly loaded"
          assert helix.auxiliary_tasks is not None and helix.auxiliary_tasks.empty
          assert helix.lineup_stats("DH1100").empty, "Line-Ups cannot use rejected B-4 or SUFFOLK fallback"
          assert "MOH" not in helix.areas(), "MOH must not be generated from rejected B-4"
          assert "Not loaded" in helix.diagnostics()["Line-Up / MOH Source"]
          assert helix.current_tasks["task_code"].nunique() == 2545
          print("PASS: official HELIX baseline is not loaded; historical B-4 rejected; Line-Ups/MOH unavailable without unauthorized fallback")
          assert helix.fte_ready_comparison().empty, "Archived FTE milestones leaked into active Construction"

          # Consolidation is a view-only transformation for HELIX Data Halls.
          # Neither source activity codes nor SUFFOLK grouping may change.
          import pandas as pd
          original_task_data = helix.current_tasks[["task_id", "task_code", "Subarea", "Status"]].copy(deep=True)
          for hall in ("DH1100", "DH1200", "DH1300", "DH1400", "DH1500", "DH1600"):
              before = helix.subarea_stats(hall)
              after = helix.subarea_stats(hall, helix_display=True)
              assert len(after) <= len(before), hall
              for column in ("Tasks", "Completed", "In Progress", "Not Started"):
                  assert int(before[column].sum()) == int(after[column].sum()), (hall, column)
              source = helix.current_tasks[helix.current_tasks["Area"].eq(hall)]
              assert int(after["Tasks"].sum()) == len(source), hall

          pd.testing.assert_frame_equal(
              original_task_data,
              helix.current_tasks[["task_id", "task_code", "Subarea", "Status"]],
          )
          # All main-view counts are strictly HELIX-assigned construction activities.
          assert helix.status_counts() == {
              "Total": 2545, "Completed": 187,
              "In Progress": 32, "Not Started": 2326
          }
          summary = dict(zip(helix.audit_reports["summary"]["Metric"], helix.audit_reports["summary"]["Value"]))
          assert int(summary["Matched to Baseline by Activity ID"]) == 2545
          assert int(summary["Previous HELIX construction"]) == 2576
          assert int(summary["Former HELIX construction no longer active"]) == 31
          assert int(summary["Current HELIX outside Construction"]) == 18
          assert len(helix.audit_reports["departures"]) == 31
          assert len(helix.audit_reports["active"]) == 2545
          removed = helix.audit_reports["departures"]
          assert removed["Activity ID"].str.endswith(".IST.6100").sum() == 6
          assert not (helix.current_tasks["task_code"].isin(removed["Activity ID"])).any()
          assert str(helix.data_date.date()) == "2026-08-26", helix.data_date
          assert str(helix.current_finish.date()) == "2027-06-22", helix.current_finish
          print("PASS: Suffolk Current-C, 2545 active HELIX Construction, BL match, 31 departures and 6 archived FTE")
          print("PASS: six HELIX Data Halls consolidated to seven groups; no changes to source activity records")

          print(f"PASS: HELIX={h_total}; SUFFOLK construction scope={s_total}; two views and line-ups validated")
          PY
