name: Import verified DC7 Current-C
on:
  push:
    branches: [audit/dc7-current-c-20261012]
    paths: [.github/workflows/import-dc7-current-c.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download, verify and package exact Drive XER
        run: |
          python -m pip install --disable-pip-version-check gdown
          python - <<'PY'
          from pathlib import Path
          import gzip, base64, hashlib, gdown

          name = "226021.010.MO-UP-C.xer"
          file_id = "1kkYE2CdWn3w0ypsMKeKu9EZESWBMQgmR"
          expected_sha256 = "91bc8183e75b0e02b130a2eee512d68c054b49deeedf24e0bc07beea67839b2d"
          output = Path("/tmp") / name
          result = gdown.download(id=file_id, output=str(output), quiet=False)
          if not result or not output.is_file():
              raise RuntimeError("Download failed; refusing to publish an unverified schedule")
          raw = output.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 5112123, (len(raw), "XER size mismatch")
          assert digest == expected_sha256, (digest, "XER SHA256 mismatch")
          if not raw.startswith(b"ERMHDR"):
              raise ValueError("Invalid XER signature")
          encoded = base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode("ascii")
          folder = Path("DC7/data")
          parts = [encoded[i:i+180000] for i in range(0, len(encoded), 180000)]
          for index, part in enumerate(parts, 1):
              (folder / f"{name}.gz.b64.part{index:03d}").write_text(part, encoding="ascii")
          (folder / f"{name}.sha256").write_text(expected_sha256+"  "+name+"\n",encoding="utf-8")
          print(f"Verified {name} SHA256={digest}; {len(parts)} encoded gzip parts")
          PY
      - name: Commit verified XER packaging to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DC7/data/226021.010.MO-UP-C.xer.gz.b64.part* DC7/data/226021.010.MO-UP-C.xer.sha256
          if ! git diff --cached --quiet; then
            git commit -m "DC7: import verified Suffolk Current-C data"
            git push origin HEAD:audit/dc7-current-c-20261012
          fi
